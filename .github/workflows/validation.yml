name: physics validation

on:
  pull_request:
    branches: [development, main]
    paths: ["macrospin/**", "spinmate_core/**", ".github/workflows/validation.yml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # kittel and afmr fail until finding F1 (anisotropy counted twice) is decided
      - run: python -m spinmate_core.validation --allow kittel --allow afmr
        env:
          WORKSPACE: ${{ runner.temp }}/spinmate
          MPLBACKEND: Agg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: ${{ runner.temp }}/spinmate/validation/
