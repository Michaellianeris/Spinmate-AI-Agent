services:
  sublattice-agent:
    build: .
    image: sublattice-agent
    ports:
      # only this computer can open the app; set BIND_ADDRESS=0.0.0.0 to share it on your network
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8421}:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-5}
      - CLAUDE_MODELS=${CLAUDE_MODELS:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1}
      - OPENAI_MODELS=${OPENAI_MODELS:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_MODELS=${GEMINI_MODELS:-}
      - SSL_CERT_FILE=${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
      - MAX_PARALLEL=${MAX_PARALLEL:-}
      - MAX_SWEEP_RUNS=${MAX_SWEEP_RUNS:-400}
      - DATABASE_URL=${DATABASE_URL-postgresql://spinmate:${POSTGRES_PASSWORD:-spinmate}@postgres:5432/spinmate}
      - QUERY_TIMEOUT_MS=${QUERY_TIMEOUT_MS:-5000}
      - CONFIRM_MINUTES=${CONFIRM_MINUTES:-10}
      - CONFIRM_RUNS=${CONFIRM_RUNS:-40}
      - EUR_PER_USD=${EUR_PER_USD:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      - MAIL_RELAY=${MAIL_RELAY:-}
      - APP_URL=${APP_URL:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - ADMIN_SHEET_URL=${ADMIN_SHEET_URL:-}
      - MUMAX3_BIN=${MUMAX3_BIN:-}
      - PRICES_JSON=${PRICES_JSON:-}
    volumes:
      - sublattice-data:/data
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # run catalog: one row per run, queried by the agent with read-only SQL
  postgres:
    image: postgres:16.6-alpine
    environment:
      - POSTGRES_USER=spinmate
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-spinmate}
      - POSTGRES_DB=spinmate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spinmate -d spinmate"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  sublattice-data:
  pgdata:
