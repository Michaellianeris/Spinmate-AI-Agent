[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spinmate-mm2d"
version = "0.1.0"
description = "SpinMate's own 2D micromagnetic solver (skyrmions, domain walls, LLG dynamics) as a SpinMate engine"
requires-python = ">=3.11"
dependencies = ["spinmate", "numpy", "matplotlib"]

[project.entry-points."spinmate.engines"]
mm2d = "spinmate_mm2d:MM2DEngine"

[tool.setuptools]
packages = ["spinmate_mm2d"]
